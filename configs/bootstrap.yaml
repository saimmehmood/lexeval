# BootstrapFewShot: self-generated demos that pass the exact-match metric.
name: bootstrap_fewshot
seed: 42

model:
  name: openai/gpt-4o-mini
  temperature: 0.0
  max_tokens: 512

data:
  dataset: coastalcph/lex_glue
  subset: ledgar
  max_chars: 2000
  train_size: 300
  val_size: 200
  test_size: 1000

program:
  module: predict

optimizer:
  type: bootstrap_fewshot
  max_bootstrapped_demos: 4
  max_labeled_demos: 8
  max_rounds: 1

inference:
  num_threads: 16
